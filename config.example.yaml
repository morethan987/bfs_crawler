# LLM configuration
llm:
  base_url: "https://api.openai.com/v1"   # OpenAI-compatible endpoint (Ollama: http://localhost:11434/v1)
  api_key: "sk-your-key-here"              # API key (use any string for Ollama)
  model: "gpt-4o"                          # Model name
  max_content_length: 32000                # Max chars of page content sent to LLM
  json_mode: "json_schema"                 # "json_schema" (OpenAI) or "json_object" (Ollama/others)
  max_retries: 3                           # LLM call retry count

# BFS crawling parameters
bfs:
  max_depth: 2                             # Max link depth from seed (0 = seed only)
  max_pages: 100                           # Max total pages to crawl
  concurrency: 3                           # Number of concurrent crawl workers
  allowed_domains:                         # Whitelist of domains to crawl (empty = all domains)
    - "example.com"

# HTTP client settings
http:
  user_agent: "BFS-Scraper/1.0"           # User-Agent header
  timeout: 30                              # HTTP request timeout in seconds
  delay: 1000                              # Delay between requests in milliseconds
  max_retries: 3                           # HTTP retry count on failure

# LLM prompt configuration
prompt:
  system_prompt: |
    You are a web page analyzer for a BFS web scraper. Your job is to:
    1. Write a concise summary (2-4 sentences) of the page content
    2. Select links from the page that are worth crawling based on the user's goal
    3. For each selected link, generate a safe folder name (snake_case, no spaces) and a file name

    Return JSON with exactly this structure:
    {
      "summary": "Brief description of the page",
      "links": [
        {"url": "https://...", "folder_name": "topic_name", "file_name": "page_title"}
      ]
    }
  user_prompt_template: |
    Page URL: {{.URL}}
    Crawl Depth: {{.Depth}}

    ## Page Content
    {{.Content}}

    ## Available Links
    {{range .Links}}- {{.}}
    {{end}}

    Select the most relevant links to follow for research purposes.

# Output configuration
output:
  base_dir: "output"                       # Root output directory for scraped markdown files
