# GoReleaser configuration for bfs_crawler
# Docs: https://goreleaser.com
version: 2

project_name: bfs_crawler

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: bfs_crawler
    main: ./cmd
    binary: bfs_crawler
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    # Exclude combinations that don't make sense
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: bfs_crawler
    builds:
      - bfs_crawler
    # Use .zip for Windows, .tar.gz for everything else
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # Include useful extra files in the archive
    files:
      - README.md
      - config.example.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Refactor"
      regexp: "^refactor"
      order: 2
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: morethan987
    name: bfs_crawler
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
